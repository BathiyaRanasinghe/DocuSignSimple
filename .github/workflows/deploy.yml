name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [main]

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: simplesign-rg
  ACA_ENVIRONMENT: simplesign-env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ env.REGISTRY }}/simplesign-api:${{ github.sha }},${{ env.REGISTRY }}/simplesign-api:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: ${{ env.REGISTRY }}/simplesign-web:${{ github.sha }},${{ env.REGISTRY }}/simplesign-web:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy API to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: simplesign-api
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY }}/simplesign-api:${{ github.sha }}
          environmentVariables: >
            PORT=4000
            NODE_ENV=production
            SUPABASE_URL=secretref:supabase-url
            SUPABASE_ANON_KEY=secretref:supabase-anon-key
            SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}

      - name: Deploy Web to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: simplesign-web
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY }}/simplesign-web:${{ github.sha }}
          environmentVariables: >
            NODE_ENV=production
            PORT=3000
