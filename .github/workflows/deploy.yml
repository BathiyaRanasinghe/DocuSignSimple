name: Deploy API to Azure Container Apps

on:
  push:
    branches: [main]

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: simplesign-rg
  ACA_ENVIRONMENT: simplesign-env

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        id: meta
        uses: docker/build-push-action@v5
        with:
          # Must be repo root — Dockerfile copies root package.json/package-lock.json
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/simplesign-api:${{ github.sha }}
            ${{ env.REGISTRY }}/simplesign-api:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: simplesign-api
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY }}/simplesign-api:${{ github.sha }}
          environmentVariables: >
            PORT=4000
            NODE_ENV=production
            SUPABASE_URL=secretref:supabase-url
            SUPABASE_ANON_KEY=secretref:supabase-anon-key
            SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
